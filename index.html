<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יחזקאל 7</title>

<style>
:root{
  --bg:#070A12;
  --glass:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.1);
  --text:#F3F6FF;
  --muted:#B6C0E0;
  --accent1:#7C3AED;
  --accent2:#22D3EE;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,58,237,.25), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(34,211,238,.25), transparent 40%),
    var(--bg);
  color:var(--text);
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:30px 50px;
  border-bottom:1px solid var(--stroke);
}

h1{
  font-size:48px;
  margin:0;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.clock{
  font-size:32px;
  color:var(--muted);
}

main{
  display:grid;
  grid-template-columns: 60% 40%;
  gap:30px;
  padding:40px;
}
body{
  padding-bottom:120px;
}

.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(20px);
}
/* תן לכל הכרטיסים גובה מינימלי יפה */
.card{
  min-height: 420px;
}


.card h2{
  margin-top:0;
  color:var(--muted);
  font-size:24px;
}

.msg{
  font-size:25px;
  font-weight:700;
  line-height:1.5;
padding: 10px 0;

  direction: rtl;
  text-align: right;

  white-space: normal;
  word-break: normal;
  overflow-wrap: normal;
}
/* שהתוכן בתוך הודעות לא יברח */
.msg{
  max-height: 330px;
  overflow: auto;
  }
  
.weather-temp{
  font-size:72px;
  font-weight:800;
}

.weather-desc{
  font-size:22px;
  color:var(--muted);
}

/* ===== NEWS TICKER (Left -> Right, swallowed under right red label) ===== */

.ticker{
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;
  background: rgba(0,0,0,0.75);
  overflow: hidden;
  z-index: 9999;

  direction: ltr; /* התנועה משמאל לימין */
}

/* האדום בימין - מעל הטקסט כדי ש"הטקסט ייבלע" */
.ticker-label{
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  background:#e10600;
  color:#fff;
  font-weight:900;
  font-size:32px;
  padding:15px 35px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  z-index: 10;
}

/* חלון הטקסט (כל השורה) */
.ticker-window{
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
}

/* המסילה */
.ticker-track{
  display: flex;
  width: max-content;
  white-space: nowrap;
  animation: tickerMoveLTR 350s linear infinite;
  will-change: transform;
}

/* הטקסט עצמו - עברית תקינה */
.ticker-item{
  white-space: nowrap;
  font-size: 48px;
  font-weight: 700;
  color: #fff;

  direction: rtl;
  unicode-bidi: plaintext;

  padding-left: 60px;
}

/* אנימציה: מתחיל מחוץ למסך משמאל ונכנס ימינה */
@keyframes tickerMoveLTR{
  from { transform: translateX(-100%); }
  to   { transform: translateX(0); }
}
  .daily{
  display:flex;
  gap:14px;
  margin-top:0 16px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding-bottom:6px;
  justify-content:flex-start;

  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.daily::-webkit-scrollbar{ display:none; }
.day{
  min-width:95px;
  text-align:center;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:14px 12px;
  flex:0 0 auto;
  backdrop-filter: blur(8px);
}
.day .d{
  font-weight:900;
  font-size:18px;
  margin-bottom:8px;
}

.day .deg{
  margin-top:8px;
  font-weight:900;
font-size:22px;
}
  
.day .icon{
  font-size: 40px;
  margin: 8px 0;
  line-height: 1;
}

.weather-now{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  margin-top:6px;
}

.now-icon{
  font-size:42px;
  line-height:1;
}

.marquee{
  flex: 1;
  min-width: 0;        /* מונע “חיתוך” בפלקס */
  overflow: hidden;
  position: relative;
}

.marquee-track{
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.marquee-content{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  white-space: nowrap;
  font-size: 40px;
  padding: 0 30px;
  color: white;

  /* זה חשוב: הטקסט רץ "מתחת" לכותרת */
  z-index: 1;

  animation: tickerMove 200s linear infinite;
}

@keyframes tickerMove{
  from { transform: translate(100%, -50%); }
  to   { transform: translate(-120%, -50%); }
}
  main {
  transform: scale(0.70);
 transform-origin: top center;
}
  
body {
  padding-bottom: 110px;
}

/* ====== THEMES ====== */

body.shabbat{
  background: linear-gradient(180deg,#0b1f3a,#071226) !important;
}

body.purim{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,215,0,.15), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(124,58,237,.25), transparent 45%),
    var(--bg) !important;
}

body.hanukkah{
  background:
    radial-gradient(circle at 50% 20%, rgba(255,215,0,.2), transparent 40%),
    linear-gradient(180deg,#0c2a52,#081428) !important;
}

body.pesach{
  background:
    radial-gradient(circle at 20% 20%, rgba(245,158,11,.15), transparent 40%),
    linear-gradient(180deg,#1e293b,#0f172a) !important;
}

body.roshhashana{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,215,0,.15), transparent 40%),
    linear-gradient(180deg,#7c2d12,#3f1d0f) !important;
}

body.shavuot{
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.15), transparent 50%),
    linear-gradient(180deg,#1e3a8a,#0f172a) !important;
}

body.independence{
  background:
    radial-gradient(circle at 20% 20%, rgba(59,130,246,.2), transparent 40%),
    linear-gradient(180deg,#1e3a8a,#0f172a) !important;
}

</header>

<main>
 <div class="card">

 <div class="msg" id="message">
🎭 <strong>משתה פורים בבניין</strong> 🎭<br><br>

 <div class="card">

</div>
  
  <script>
// שעון
function updateClock(){
  const now = new Date();

  const time = now.toLocaleTimeString("he-IL", {
    hour: "2-digit",
    minute: "2-digit"
  });

  const date = now.toLocaleDateString("he-IL", {
    weekday: "long",
    day: "numeric",
    month: "numeric",
    year: "numeric"
  });

  // תאריך עברי: "4 באדר 5786"
  const rawHeb = new Intl.DateTimeFormat("he-IL-u-ca-hebrew", {
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(now).replace(",", "");

  // חילוץ יום/חודש/שנה
  const m = rawHeb.match(/(\d+)\s+(.+?)\s+(\d+)/);
  let hebrewDatePretty = rawHeb;

  if (m) {
    const dayNum = parseInt(m[1], 10);
    const monthName = m[2].trim();
    const yearNum = parseInt(m[3], 10);
    hebrewDatePretty = `${hebrewDay(dayNum)} ${monthName} ${hebrewYear(yearNum)}`;
  }

  document.getElementById("clock").innerHTML =
    time + " | " + date + "<br>" + hebrewDatePretty;
}

function hebrewDay(n) {
  const map = {
    1:"א׳",2:"ב׳",3:"ג׳",4:"ד׳",5:"ה׳",6:"ו׳",7:"ז׳",8:"ח׳",9:"ט׳",10:"י׳",
    11:"י״א",12:"י״ב",13:"י״ג",14:"י״ד",15:"ט״ו",16:"ט״ז",17:"י״ז",18:"י״ח",19:"י״ט",20:"כ׳",
    21:"כ״א",22:"כ״ב",23:"כ״ג",24:"כ״ד",25:"כ״ה",26:"כ״ו",27:"כ״ז",28:"כ״ח",29:"כ״ט",30:"ל׳"
  };
  return map[n] || String(n);
}

function hebrewYear(year) {
  const y = year % 1000;        // למשל 786
  const hundreds = Math.floor(y / 100) * 100; // 700
  const tensOnes = y % 100;     // 86

  const hMap = {100:"ק",200:"ר",300:"ש",400:"ת",500:"תק",600:"תר",700:"תש",800:"תת",900:"תתק"};
  const tMap = {10:"י",20:"כ",30:"ל",40:"מ",50:"נ",60:"ס",70:"ע",80:"פ",90:"צ"};
  const oMap = {1:"א",2:"ב",3:"ג",4:"ד",5:"ה",6:"ו",7:"ז",8:"ח",9:"ט"};

  let s = (hMap[hundreds] || "");

  if (tensOnes === 15) s += "טו";
  else if (tensOnes === 16) s += "טז";
  else {
    const tens = Math.floor(tensOnes / 10) * 10;
    const ones = tensOnes % 10;
    s += (tMap[tens] || "") + (oMap[ones] || "");
  }

  if (s.length === 1) s += "׳";
  else s = s.slice(0, -1) + "״" + s.slice(-1);

  return s;
}

async function loadShabbatInfo() {

  const box = document.getElementById("shabbatBox");

const dayIL = new Intl.DateTimeFormat("en-US", {
  timeZone: "Asia/Jerusalem",
  weekday: "short"
}).format(new Date()); // Fri / Sat

if (dayIL !== "Fri" && dayIL !== "Sat") {
  box.style.display = "none";
  return;
}

box.style.display = "block";  // קואורדינטות כפר סבא
  const lat = 32.175;
  const lon = 34.906;

  try {

    // קבלת פרשה וזמנים מ-hebcal
    const response = await fetch(
      `https://www.hebcal.com/shabbat?cfg=json&latitude=${lat}&longitude=${lon}&tzid=Asia/Jerusalem`
    );

    const data = await response.json();

    const parasha = data.parsha || "";
    const candles = data.items.find(i => i.category === "candles")?.title || "";

    // טקסט קצר אוטומטי
    const parashaSummary = `
    בפרשה זו אנו לומדים על ערכים חשובים של אמונה,
    אחריות ומעשים טובים. כל שבוע הוא הזדמנות להתחזק
    ולחבר את הבית לאור של שבת.
    `;

    box.innerHTML = `
      <div style="font-size:26px;margin-bottom:10px;">
        פרשת השבוע: ${parasha}
      </div>

      <div style="margin-bottom:10px;">
        🕯 ${candles}
      </div>

      <div style="font-size:18px;line-height:1.6;">
        ${parashaSummary}
      </div>
    `;

  } catch (err) {
    console.log("Shabbat error:", err);
  }
}

loadShabbatInfo();  
setInterval(updateClock, 1000);
updateClock();
// מזג אוויר כפר סבא - ימים הבאים
async function loadWeather(){
  const LAT = 32.1750, LON = 34.9060;
const url =
  `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
  `&current=temperature_2m,weather_code,is_day` +
  `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
 `&timezone=Asia%2FJerusalem`;
  const dayNames = ["א","ב","ג","ד","ה","ו","ש"];
  const r = await fetch(url);
  const data = await r.json();
// ===== Next days =====
const nDays = Math.min(7, data.daily.time.length);
let dailyHtml = "";
for (let i = 0; i < 5; i++) {
  const dt = new Date(data.daily.time[i]);
  const dayName = dayNames[dt.getDay()];

  const max = Math.round(data.daily.temperature_2m_max[i]);
  const min = Math.round(data.daily.temperature_2m_min[i]);
  const code = data.daily.weather_code[i];

  dailyHtml += `
    <div class="day">
      <div class="d">${dayName}</div>
      <div class="icon">${iconFor(code, true)}</div>
      <div class="deg">${min}° / ${max}°</div>
    </div>
  `;
}

document.getElementById("daily").innerHTML = dailyHtml;   // טמפרטורה עכשיו
  document.getElementById("temp").innerText =
    Math.round(data.current.temperature_2m) + "°";
const nowCode = data.current.weather_code;
const isDay = data.current.is_day === 1;

document.getElementById("weatherDesc").innerText =
" כעת: " + textFor(nowCode);

document.getElementById("nowIcon").innerText =
  iconFor(nowCode, isDay);  
  //document.getElementById("weatherDesc").innerText = "כעת";
  

document.getElementById("daily").innerHTML = dailyHtml;   
 // ===== Weather code -> icon + text =====
}

function iconFor(code, isDay){
  if (code === 0) return "☀️";
  if (code >= 1 && code <= 3) return "⛅️";
  if (code === 45 || code === 48) return "🌫️";

  // drizzle / rain
  if (code >= 51 && code <= 57) return "🌦️";
  if (code >= 61 && code <= 67) return "🌧️";

  // snow
  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 85 && code <= 86) return "🌨️";

  // showers
  if (code >= 80 && code <= 82) return "🌧️";

  // thunder
  if (code >= 95 && code <= 99) return "⛈️";

  return "🌡️";
}

function textFor(code){
  if (code === 0) return "בהיר";
  if (code >= 1 && code <= 3) return "מעונן חלקית";
  if (code === 45 || code === 48) return "ערפל";
  if (code >= 51 && code <= 57) return "טפטוף";
  if (code >= 61 && code <= 67) return "גשם";
  if (code >= 71 && code <= 77) return "שלג";
  if (code >= 80 && code <= 82) return "ממטרים";
  if (code >= 85 && code <= 86) return "ממטרי שלג";
  if (code >= 95 && code <= 99) return "סופות רעמים";
  return "מזג אוויר";
}



  
loadWeather();
setInterval(loadWeather, 30*60*1000);

// ===== NEWS (keeps last text, duplicates for smooth loop, restarts animation cleanly) =====
let lastNewsText = "טוען חדשות...";

function applyNewsText(text){
  const newsEl = document.getElementById("news");
  const cloneEl = document.getElementById("newsClone");

  if (newsEl) newsEl.textContent = text;
  if (cloneEl) cloneEl.textContent = text;

  // ריסט אנימציה בלי "רגע ריק"
  const track = document.getElementById("tickerTrack");
  if (track){
    track.style.animation = "none";
    track.offsetHeight; // force reflow
    track.style.animation = "";
  }
}

function loadNews(){
  fetch("https://yne-ptoxy0.657moshe.workers.dev/?url=https://www.ynet.co.il/Integration/StoryRss2.xml")
    .then(r => r.text())
    .then(str => new DOMParser().parseFromString(str, "text/xml"))
    .then(xml => {
      const items = Array.from(xml.querySelectorAll("item")).slice(0, 15);
      const titles = items
        .map(it => it.querySelector("title")?.textContent?.trim())
        .filter(Boolean);

      const text = titles.length ? (titles.join(" • ") + " • ") : lastNewsText;

      if (titles.length) lastNewsText = text;
      applyNewsText(lastNewsText);
    })
    .catch(() => {
      // במקרה של תקלה - לא מנקים, נשאר הטקסט האחרון
      applyNewsText(lastNewsText);
    });
}

// טעינה ראשונית + עדכון כל 10 דקות
loadNews(); 
setInterval(() => location.reload(), 60 * 60 * 1000);

  loadNews();
setInterval(loadNews, 10 * 60 * 1000);
    
// רענון כל שעה
setInterval(function() {
  location.reload();
}, 60 * 60 * 1000);
function applyHolidayTheme(){
  const now = new Date();
  const month = now.getMonth()+1;
  const date = now.getDate();
  const day = now.getDay();
  const hour = now.getHours();

  document.body.classList.remove(
    "shabbat","purim","hanukkah",
    "pesach","roshhashana",
    "shavuot","independence"
  );

  /* שבת */
  if(day === 5 || day === 6){
  document.body.classList.add("shabbat");
}

  /* פורים – לדוגמה 14 במרץ */
  if(month === 3 && date === 14){
    document.body.classList.add("purim");
  }

  /* חנוכה – לדוגמה 25-31 בדצמבר */
  if(month === 12 && date >= 25 && date <= 31){
    document.body.classList.add("hanukkah");
  }

  /* פסח – לדוגמה אפריל 22-29 */
  if(month === 4 && date >= 22 && date <= 29){
    document.body.classList.add("pesach");
  }

  /* ראש השנה – לדוגמה ספטמבר 10-12 */
  if(month === 9 && date >= 10 && date <= 12){
    document.body.classList.add("roshhashana");
  }

  /* שבועות – לדוגמה יוני 1-2 */
  if(month === 6 && date <= 2){
    document.body.classList.add("shavuot");
  }

  /* יום העצמאות – לדוגמה 14 במאי */
  if(month === 5 && date === 14){
    document.body.classList.add("independence");
  }
}

applyHolidayTheme();
setInterval(applyHolidayTheme, 60*60*1000);

</script>
