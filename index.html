<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יחזקאל 7</title>

<style>
:root{
  --bg:#070A12;
  --glass:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.1);
  --text:#F3F6FF;
  --muted:#B6C0E0;
  --accent1:#7C3AED;
  --accent2:#22D3EE;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,58,237,.25), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(34,211,238,.25), transparent 40%),
    var(--bg);
  color:var(--text);
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:30px 50px;
  border-bottom:1px solid var(--stroke);
}

h1{
  font-size:48px;
  margin:0;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.clock{
  font-size:32px;
  color:var(--muted);
}

main{
  display:grid;
  grid-template-columns:1.3fr .8fr;
  gap:30px;
  padding:40px;
  height:calc(100vh - 130px);
}

.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(20px);
}

.card h2{
  margin-top:0;
  color:var(--muted);
  font-size:24px;
}

.msg{
  font-size:36px;
  font-weight:700;
  line-height:1.4;
}

.weather-temp{
  font-size:72px;
  font-weight:800;
}

.weather-desc{
  font-size:22px;
  color:var(--muted);
}

.ticker{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:90px;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  padding:0 34px;
  overflow:hidden;
  font-size:34px;
  font-weight:800;
}

.marquee{
  white-space:nowrap;
  animation:scroll 120s linear infinite;
}

@keyframes scroll{
  from{transform:translateX(-10%)}
  to{transform:translateX(100%)}
}
.daily{
  display:flex;
  gap:14px;
  margin-top:0 16px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding-bottom:6px;
  justify-content:flex-start;

  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.daily::-webkit-scrollbar{ display:none; }
.day{
  min-width:95px;
  text-align:center;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:14px 12px;
  flex:0 0 auto;
  backdrop-filter: blur(8px);
}
.day .d{
  font-weight:900;
  font-size:18px;
  margin-bottom:8px;
}

.day .deg{
  margin-top:8px;
  font-weight:900;
font-size:22px;
}
  
.day .icon{
  font-size: 40px;
  margin: 8px 0;
  line-height: 1;
}
}

.weather-now{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  margin-top:6px;
}

.now-icon{
  font-size:42px;
  line-height:1;
}}</style>
</head>

<body>

<header>
  <h1>יחזקאל 7</h1>
  <div class="clock" id="clock"></div>
</header>

<main>
  <div class="card">
    <h2>הודעות</h2>
    <div class="msg" id="message">
      ברוכים הבאים ליחזקאל 7 🏢<br>
      נא לשמור על השקט וניקיון הבניין.
    </div>
  </div>

 <div class="card">
  <h2>מזג אוויר – כפר סבא</h2>

  <div class="weather-now">
  <div class="weather-temp" id="temp">--°</div>

  <div class="weather-now-meta">
    <div class="weather-desc" id="weatherDesc">טוען...</div>
    <div class="now-icon" id="nowIcon"></div>
  </div>
</div>

  <div class="daily" id="daily"></div>
</div>
</main>

<div class="ticker">
  <div class="marquee" id="news">טוען חדשות...</div>
</div>

<script>
// שעון
function updateClock(){
  const now=new Date();
  document.getElementById("clock").innerText=
    now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

// מזג אוויר כפר סבא - ימים הבאים
async function loadWeather(){
  const LAT = 32.1750, LON = 34.9060;
const url =
  `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
  `&current=temperature_2m,weather_code,is_day` +
  `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
 `&timezone=Asia%2FJerusalem`;
  const dayNames = ["א","ב","ג","ד","ה","ו","ש"];
  const r = await fetch(url);
  const data = await r.json();
// ===== Next days =====
const nDays = Math.min(7, data.daily.time.length);
let dailyHtml = "";
for (let i = 0; i < nDays; i++) {
  const dt = new Date(data.daily.time[i]);
  const dayName = dayNames[dt.getDay()];

  const max = Math.round(data.daily.temperature_2m_max[i]);
  const min = Math.round(data.daily.temperature_2m_min[i]);
  const code = data.daily.weather_code[i];

  dailyHtml += `
    <div class="day">
      <div class="d">${dayName}</div>
      <div class="icon">${iconFor(code, true)}</div>
      <div class="deg">${min}° / ${max}°</div>
    </div>
  `;
}

document.getElementById("daily").innerHTML = dailyHtml;   // טמפרטורה עכשיו
  document.getElementById("temp").innerText =
    Math.round(data.current.temperature_2m) + "°";
const nowCode = data.current.weather_code;
const isDay = data.current.is_day === 1;

document.getElementById("weatherDesc").innerText =
" כעת: " + textFor(nowCode);

document.getElementById("nowIcon").innerText =
  iconFor(nowCode, isDay);  
  //document.getElementById("weatherDesc").innerText = "כעת";
  

document.getElementById("daily").innerHTML = dailyHtml;   
 // ===== Weather code -> icon + text =====
}

function iconFor(code, isDay){
  if (code === 0) return "☀️";
  if (code >= 1 && code <= 3) return "⛅️";
  if (code === 45 || code === 48) return "🌫️";

  // drizzle / rain
  if (code >= 51 && code <= 57) return "🌦️";
  if (code >= 61 && code <= 67) return "🌧️";

  // snow
  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 85 && code <= 86) return "🌨️";

  // showers
  if (code >= 80 && code <= 82) return "🌧️";

  // thunder
  if (code >= 95 && code <= 99) return "⛈️";

  return "🌡️";
}

function textFor(code){
  if (code === 0) return "בהיר";
  if (code >= 1 && code <= 3) return "מעונן חלקית";
  if (code === 45 || code === 48) return "ערפל";
  if (code >= 51 && code <= 57) return "טפטוף";
  if (code >= 61 && code <= 67) return "גשם";
  if (code >= 71 && code <= 77) return "שלג";
  if (code >= 80 && code <= 82) return "ממטרים";
  if (code >= 85 && code <= 86) return "ממטרי שלג";
  if (code >= 95 && code <= 99) return "סופות רעמים";
  return "מזג אוויר";
}



  
loadWeather();
setInterval(loadWeather, 30*60*1000);

// חדשות ynet (RSS)
fetch(
 "https://yne-ptoxy0.657moshe.workers.dev/?url=" +
    encodeURIComponent("https://www.ynet.co.il/Integration/StoryRss2.xml")
)
 .then((r) => r.text())
.then((data) => {
  const parser = new DOMParser();
  const xml = parser.parseFromString(data, "text/xml");
    const items = xml.querySelectorAll("item");

    let titles = "";
    items.forEach((item, i) => {
      if (i < 10) {
        titles += " • " + item.querySelector("title").textContent;
      }
    });

    document.getElementById("news").innerText = titles;
  })
.catch((err) => console.log("RSS error:", err));
</script>
</body>
</html>
